<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Logo Diagnóstico Empresarial 3i sin texto">
  <defs>
    <linearGradient id="ringGrad" x1="80" y1="80" x2="432" y2="432" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EB60"/>
      <stop offset="0.35" stop-color="#E9683B"/>
      <stop offset="0.68" stop-color="#865CF0"/>
      <stop offset="1" stop-color="#5454E9"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="105" y1="345" x2="410" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5454E9"/>
      <stop offset="0.5" stop-color="#5AC8F5"/>
      <stop offset="1" stop-color="#865CF0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#1f2a44" flood-opacity="0.18"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <!-- Segmented circular frame -->
    <path d="M256 72a184 184 0 0 1 156 86" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M431 250a184 184 0 0 1-93 163" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M256 440a184 184 0 0 1-156-86" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round"/>
    <path d="M81 262a184 184 0 0 1 93-163" fill="none" stroke="url(#ringGrad)" stroke-width="32" stroke-linecap="round"/>

    <!-- Growth bars -->
    <rect x="147" y="285" width="53" height="102" rx="10" fill="#E9683B"/>
    <rect x="222" y="230" width="53" height="157" rx="10" fill="#E4EB60"/>
    <rect x="297" y="174" width="53" height="213" rx="10" fill="#865CF0"/>

    <!-- Upward arrow -->
    <path d="M111 344 C190 322 257 276 334 199 L306 185 L408 151 L386 259 L364 226 C286 304 210 349 119 375 Z" fill="url(#arrowGrad)"/>

    <!-- 3i dot -->
    <circle cx="372" cy="111" r="25" fill="#E4EB60"/>
  </g>
</svg>
